[package]
name          = "guard-core-rs-actix-app"
version       = "0.1.0"
authors       = { workspace = true }
categories    = { workspace = true }
description   = "Rate-limit and dynamic-ban stage for actix-web over guard-core-rs (example service)."
documentation = { workspace = true }
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
rust-version  = { workspace = true }
publish       = false

[dependencies]
actix-web    = { version = "4", default-features = false, features = ["macros"] }
guard-core-rs = { workspace = true }

[dev-dependencies]
# actix-web does not re-export `actix_http::Request`, the request type its
# test harness serves to an initialized app; tests name it directly.
actix-http = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
