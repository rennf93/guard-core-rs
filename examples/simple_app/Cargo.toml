[package]
name          = "guard-core-rs-simple-app"
version       = "0.1.0"
authors       = { workspace = true }
categories    = { workspace = true }
description   = "Minimal guard-core-rs example service."
documentation = { workspace = true }
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
rust-version  = { workspace = true }
publish       = false

[dependencies]
bytes           = "1.10"
http            = "1.3"
http-body       = "1.0"
http-body-util  = "0.1"
hyper           = { version = "1", features = ["http1"] }
hyper-util      = { version = "0.1", features = ["http1", "server", "server-auto", "service", "tokio"] }
percent-encoding = "2.3.2"
tokio           = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower           = { version = "0.5", default-features = false }
guard-core-rs   = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                      = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
module_name_repetitions  = "allow"
nursery                  = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
